name: Deploy to FTP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # FTPのSecret(FTP_SERVER)が未設定の間はデプロイ手順をスキップ（エラーにしない）
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # ロリポップ！は明示的FTP over TLS（FTPS）
          protocol: ftps
          port: 21
          # 公開ディレクトリ（宝栄サーバーのパス）。例: ./public_html/  ※末尾スラッシュ必須
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./
          # アップロード対象から除外
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
            **/*.md
