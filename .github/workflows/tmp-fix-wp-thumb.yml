name: TMP fix WP theme thumbnail (functions.php)

# 一時ワークフロー：一覧のサムネイルが空になる不具合の修正。反映後に削除する。
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER:   ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      REMOTE: wp/wp-content/themes/houei
    steps:
      - name: Download current functions.php
        run: |
          curl -sS --fail --ssl-reqd -u "${FTP_USERNAME}:${FTP_PASSWORD}" \
            "ftp://${FTP_SERVER}/${REMOTE}/functions.php" -o cur.php
          wc -c cur.php

      - name: Patch (wp-image-ID を数字だけ取り出す)
        run: |
          cp cur.php new.php
          OLD="preg_match_all('/<img.+?class=\".+?wp-image-(.+).*?\".*?>/i', \$post->post_content, \$matches);"
          NEW="preg_match_all('/<img[^>]+?wp-image-(\\\\d+)/i', \$post->post_content, \$matches);"
          COUNT=$(grep -cF "$OLD" cur.php || true)
          echo "match count: $COUNT"
          if [ "$COUNT" != "1" ]; then echo "対象行が1件ではないので中止"; exit 1; fi
          OLD="$OLD" NEW="$NEW" python3 - <<'EOF'
          import os
          s = open('cur.php', encoding='utf-8').read()
          s = s.replace(os.environ['OLD'], os.environ['NEW'].replace('\\\\d', '\\d'), 1)
          open('new.php', 'w', encoding='utf-8').write(s)
          EOF
          diff cur.php new.php || true
          grep -cF "wp-image-(\d+)" new.php

      - name: Lint
        run: php -l new.php

      - name: Backup on server, then upload
        run: |
          curl -sS --fail --ssl-reqd -u "${FTP_USERNAME}:${FTP_PASSWORD}" \
            -T cur.php "ftp://${FTP_SERVER}/${REMOTE}/functions.php.bak-20261112"
          curl -sS --fail --ssl-reqd -u "${FTP_USERNAME}:${FTP_PASSWORD}" \
            -T new.php "ftp://${FTP_SERVER}/${REMOTE}/functions.php"

      - name: Verify site, roll back on failure
        run: |
          sleep 5
          CODE=$(curl -s -o top.html -w '%{http_code}' -A 'Mozilla/5.0' https://houei-home.jp/)
          EMPTY=$(grep -c '<img src="" ' top.html || true)
          echo "http=$CODE empty_src=$EMPTY size=$(wc -c < top.html)"
          if [ "$CODE" != "200" ] || [ "$(wc -c < top.html)" -lt 20000 ]; then
            echo "表示異常のため元に戻す"
            curl -sS --fail --ssl-reqd -u "${FTP_USERNAME}:${FTP_PASSWORD}" \
              -T cur.php "ftp://${FTP_SERVER}/${REMOTE}/functions.php"
            exit 1
          fi
